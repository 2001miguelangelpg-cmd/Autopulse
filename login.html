<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCESO - Autopulse</title>
    <meta name="description" content="Inicia sesión en tu cuenta de Autopulse.">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Segoe+UI:wght@400;600&display=swap"

<body>

    <!-- CABECERA DE NAVEGACIÓN -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo-link">

                    alt="Autopulse Logo" class="logo-img">
            </a>
            <nav class="nav-links">
                <a href="index.html">INICIO</a>
                <a href="registro.html">REGISTRARSE</a>
                <a href="login.html" class="active">ACCESO</a>
            </nav>
        </div>
    </header>

    <!-- FORMULARIO DE ACCESO -->
    <main class="login-container">
        <!-- Mensaje de estado/error -->
        <div id="alertBox" class="alert-box"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="userOrEmail">Username or E-mail</label>
                <input type="text" id="userOrEmail" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>

            <div class="button-group">
                <button type="submit" class="btn-login">Iniciar sesión</button>
                <a href="registro.html" class="btn-register">REGISTRARSE</a>
            </div>
        </form>

        <div class="form-footer">
            <button class="btn-demo" onclick="loginAsDemo()">Iniciar con Perfil Demo</button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>Derechos de autor © 2027 Autopulse | Desarrollado por Miguel Angel Porras</p>
    </footer>

    <!-- BOTÓN FLOTANTE WHATSAPP -->

    <script>
        // Obtener la lista de usuarios de localStorage
        function getUsers() {
            return JSON.parse(localStorage.getItem('autopulse_users')) || [];
        }

        // Mostrar mensajes de alerta
        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerText = msg;
            alertBox.className = isSuccess ? 'alert-box success show' : 'alert-box error show';
        }

        // Proceso de inicio de sesión
        function handleLogin(e) {
            e.preventDefault();

            const inputVal = document.getElementById('userOrEmail').value.trim().toLowerCase();
            const passwordVal = document.getElementById('password').value;

            const users = getUsers();

            // Buscar coincidencia por usuario o email
            const foundUser = users.find(u =>
                (u.username.toLowerCase() === inputVal || u.email.toLowerCase() === inputVal) &&
                u.password === passwordVal
            );

            if (foundUser) {
                // Guardar la sesión activa
                localStorage.setItem('autopulse_logged_user', JSON.stringify(foundUser));
                showAlert(`¡Bienvenido de nuevo, ${foundUser.firstname || foundUser.username}! Redirigiendo...`, true);

                setTimeout(() => {
                    window.location.href = 'Home.html'; // Redirigir a la landing / panel principal
                }, 1500);
            } else {
                showAlert('Usuario/correo o contraseña incorrectos');
            }
        }

        // Acceso rápido con perfil de prueba (Demo)
        function loginAsDemo() {
            const demoUser = {
                username: 'motero_demo',
                firstname: 'Juan',
                lastname: 'Pérez',
                email: 'demo@autopulse.com'
            };

            localStorage.setItem('autopulse_logged_user', JSON.stringify(demoUser));
            showAlert('Iniciando sesión como Usuario Demo...', true);

            setTimeout(() => {
                window.location.href = 'Home.html';
            }, 1200);
        }
    </script>
</body>
