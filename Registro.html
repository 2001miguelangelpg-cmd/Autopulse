<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRARSE - Autopulse</title>
    <meta name="description" content="Crea tu cuenta en Autopulse y gestiona el mantenimiento de tu moto.">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Segoe+UI:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <!-- CABECERA Y ENCABEZADO DE NAVEGACIÓN -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo-link">
                <img src="https://autopulse.tucontenido.com.co/wp-content/uploads/2026/09/cropped-Autopulse-logo-300x150.png"
                    alt="Autopulse Logo" class="logo-img">
            </a>
            <nav class="nav-links">
                <a href="index.html">INICIO</a>
                <a href="registro.html" class="active">REGISTRARSE</a>
                <a href="login.html">ACCESO</a>
            </nav>
        </div>
    </header>

    <main class="register-container">
        <h1 class="title">REGISTRARSE</h1>

        <!-- Mensaje de estado/error -->
        <div id="alertBox" class="alert-box"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="firstname">Nombre</label>
                <input type="text" id="firstname" required>
            </div>

            <div class="form-group">
                <label for="lastname">Apellidos</label>
                <input type="text" id="lastname" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail Address</label>
                <input type="email" id="email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" placeholder="Confirmar Contraseña" required
                    autocomplete="new-password">
            </div>

            <button type="submit" class="btn-submit">Registro</button>
        </form>

        <div class="form-footer">
            <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            <button class="btn-demo" onclick="createDemoAccount()">Cargar Perfil Demo de Prueba</button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>Derechos de autor © 2027 Autopulse | Desarrollado por Miguel Angel Porras</p>
    </footer>

    <!-- Botón flotante de WhatsApp -->
    <a href="https://wa.me/573000000000" class="whatsapp-float" target="_blank" rel="noopener noreferrer"
        aria-label="Contacto por WhatsApp">
        <svg viewBox="0 0 32 32">
            <path
                d="M16 0c-8.837 0-16 7.163-16 16 0 2.825 0.737 5.607 2.137 8.048l-2.137 7.952 8.134-2.132c2.378 1.298 5.068 1.98 7.866 1.98 8.837 0 16-7.163 16-16s-7.163-16-16-16zM16 29.35c-2.48 0-4.908-0.67-7.027-1.933l-0.504-0.301-5.221 1.368 1.393-5.184-0.331-0.526c-1.385-2.203-2.115-4.755-2.115-7.374 0-7.614 6.191-13.805 13.805-13.805s13.805 6.191 13.805 13.805-6.191 13.805-13.805 13.805zM22.511 19.167c-0.357-0.179-2.112-1.042-2.439-1.161s-0.565-0.179-0.803 0.179c-0.238 0.357-0.923 1.161-1.131 1.4-0.208 0.238-0.417 0.268-0.774 0.089s-1.513-0.558-2.882-1.778c-1.066-0.95-1.786-2.123-1.994-2.48-0.208-0.357-0.022-0.55 0.156-0.728 0.161-0.16 0.357-0.417 0.536-0.625 0.179-0.208 0.238-0.357 0.357-0.595 0.119-0.238 0.060-0.446-0.030-0.625s-0.803-1.935-1.101-2.649c-0.29-0.695-0.585-0.601-0.803-0.612s-0.446-0.012-0.685-0.012c-0.238 0-0.625 0.089-0.952 0.446s-1.25 1.221-1.25 2.977c0 1.756 1.279 3.453 1.458 3.691s2.519 3.847 6.103 5.394c0.852 0.368 1.518 0.588 2.037 0.753 0.856 0.272 1.636 0.234 2.252 0.142 0.687-0.103 2.112-0.863 2.41-1.697 0.298-0.833 0.298-1.548 0.208-1.697-0.089-0.149-0.327-0.238-0.685-0.417z">
            </path>
        </svg>
    </a>

    <script>
        // Obtener usuarios almacenados o inicializar un array vacío
        function getUsers() {
            return JSON.parse(localStorage.getItem('autopulse_users')) || [];
        }

        // Mostrar mensajes de alerta
        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerText = msg;
            alertBox.className = isSuccess ? 'alert-box success show' : 'alert-box error show';
        }

        // Manejar el registro de nuevos usuarios
        function handleRegister(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const firstname = document.getElementById('firstname').value.trim();
            const lastname = document.getElementById('lastname').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showAlert('Las contraseñas no coinciden');
                return;
            }

            const users = getUsers();

            // Verificar si el usuario o email ya existe
            const userExists = users.some(u => u.username === username || u.email === email);
            if (userExists) {
                showAlert('El nombre de usuario o correo ya está registrado');
                return;
            }

            // Crear el objeto del nuevo usuario
            const newUser = {
                username,
                firstname,
                lastname,
                email,
                password
            };

            users.push(newUser);
            localStorage.setItem('autopulse_users', JSON.stringify(users));

            showAlert('¡Registro exitoso! Redirigiendo al inicio de sesión...', true);

            setTimeout(() => {
                window.location.href = 'login.html'; // Redirección al módulo de Login
            }, 1500);
        }

        // Crear perfil determinado (Demo) para pruebas rápidas
        function createDemoAccount() {
            const users = getUsers();
            const demoUser = {
                username: 'motero_demo',
                firstname: 'Juan',
                lastname: 'Pérez',
                email: 'demo@autopulse.com',
                password: '123'
            };

            const exists = users.some(u => u.username === demoUser.username);
            if (!exists) {
                users.push(demoUser);
                localStorage.setItem('autopulse_users', JSON.stringify(users));
            }

            showAlert('Perfil Demo cargado (Usuario: motero_demo | Clave: 123). Redirigiendo...', true);
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        }
    </script>
</body>

</html>
